name: Stewart Acid Base Sid Analyzer CI/CD & Security Verification

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Validate Python sources
      run: python -m compileall -q .

    - name: Run Pytest Suite
      run: pytest -v

    - name: Identifier Filter and Audit Integrity Smoke Test
      run: |
        python -c "
        from agents.base import PHIGuard, AuditLogger, SecurityException
        assert AuditLogger.verify_integrity() is True
        try:
            PHIGuard.assert_no_phi('MRN-994827')
            raise AssertionError('Known identifier was not blocked')
        except SecurityException:
            pass
        print('Identifier filter and HMAC audit checks passed')
        
        "

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: test-and-audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          mkdir -p _site/web
          cp index.html _site/index.html
          cp web/index.html _site/web/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published HTML
        env:
          LIVE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --location --retry 5 --retry-delay 2 "$LIVE_URL" --output /tmp/stewart-pages.html
          grep -q 'id="calculator"' /tmp/stewart-pages.html
          grep -q 'id="download"' /tmp/stewart-pages.html
