version: '3.8'

services:
  stewart-acid-base-sid-analyzer:
    build: .
    container_name: stewart-acid-base-sid-analyzer
    ports:
      - "8000:8000"
    environment:
      - AUDIT_SECRET_KEY=stewart-acid-base-sid-analyzer-prod-audit-key-2026
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
